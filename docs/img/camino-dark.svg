nt-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">RevisionPendiente</text><text x="868.0" y="431.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="middle">PENDIENTE</text><rect x="48" y="300" width="380" height="76" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.2" stroke-dasharray="5 4"/><text x="68" y="328" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">corrida_id = sha256(plan + adjunto + form)</text><text x="68" y="350" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">El reintento de Looker converge: reescribe la misma</text><text x="68" y="366" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">corrida en vez de duplicar la conclusión.</text><text x="48" y="460" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">Ningún LLM tiene credenciales de la base: propone la consulta, nunca la escritura.</text></svg>